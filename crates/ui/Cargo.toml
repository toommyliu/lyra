[package]
name = "mira-ui"
version = "0.1.0"
edition = "2024"
publish = false

[features]
test-support = ["dep:gpui_apple", "gpui/test-support"]

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui_apple = { workspace = true, optional = true, features = ["font-kit", "test-support"] }
unicode-segmentation.workspace = true

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
mira-ui = { path = ".", features = ["test-support"] }
