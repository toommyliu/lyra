[package]
name = "mira"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["crates/ui"]

[workspace.dependencies]
anyhow = "1"
gpui = { git = "https://github.com/zed-industries/zed", rev = "985bbf42e684ef5b5a9312a6abf075aeafbaf5b9", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "985bbf42e684ef5b5a9312a6abf075aeafbaf5b9", features = ["font-kit"] }
mira-ui = { path = "crates/ui" }
unicode-segmentation = "1"

[dependencies]
anyhow.workspace = true
arboard = { version = "3.7", default-features = false }
async-channel = "2.5"
async-task = "4.7"
block2 = "0.6"
dirs = "6"
encoding_rs = "0.8.35"
getrandom = "0.2"
gpui.workspace = true
gpui_platform.workspace = true
mira-ui.workspace = true
objc2 = "0.6"
oxc = { version = "0.157", features = ["codegen", "semantic", "transformer"] }
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSView", "NSResponder", "NSGraphics", "NSWindow"] }
objc2-core-graphics = "0.3"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSNotification"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer", "CATransaction"] }
raw-window-handle = "0.6"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "native-tls", "stream"] }
rquickjs = { version = "0.14", features = ["loader"] }
ruffle_core = { git = "https://github.com/toommyliu/ruffle", rev = "fe9ba49dcae51ab8c3855f341d9294f3ed610f55", features = ["aac", "audio", "default_compatibility_rules", "default_font", "lzma", "mp3", "nellymoser", "stats"] }
ruffle_frontend_utils = { git = "https://github.com/toommyliu/ruffle", rev = "fe9ba49dcae51ab8c3855f341d9294f3ed610f55", default-features = false, features = ["cpal", "fs"] }
ruffle_render = { git = "https://github.com/toommyliu/ruffle", rev = "fe9ba49dcae51ab8c3855f341d9294f3ed610f55" }
ruffle_render_wgpu = { git = "https://github.com/toommyliu/ruffle", rev = "fe9ba49dcae51ab8c3855f341d9294f3ed610f55" }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[dev-dependencies]
swf = { git = "https://github.com/toommyliu/ruffle", rev = "fe9ba49dcae51ab8c3855f341d9294f3ed610f55" }
tokio = { version = "1", features = ["test-util"] }

[patch.crates-io]
naga = { git = "https://github.com/toommyliu/ruffle", rev = "fe9ba49dcae51ab8c3855f341d9294f3ed610f55" }
wgpu-core = { git = "https://github.com/toommyliu/ruffle", rev = "fe9ba49dcae51ab8c3855f341d9294f3ed610f55" }
wgpu-hal = { git = "https://github.com/toommyliu/ruffle", rev = "fe9ba49dcae51ab8c3855f341d9294f3ed610f55" }
wgpu-types = { git = "https://github.com/toommyliu/ruffle", rev = "fe9ba49dcae51ab8c3855f341d9294f3ed610f55" }


[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
