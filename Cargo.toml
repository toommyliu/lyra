[package]
name = "lyra"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
arboard = { version = "3.7", default-features = false }
async-channel = "2.5"
async-task = "4.7"
dirs = "6"
encoding_rs = "0.8.35"
getrandom = "0.2"
gpui = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba", features = ["font-kit"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder", "NSGraphics"] }
objc2-core-graphics = "0.3"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer", "CATransaction"] }
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "native-tls", "stream"] }
ruffle_core = { git = "https://github.com/toommyliu/ruffle", rev = "b22a3560baeddbfb92001f54b47561997563a032", features = ["aac", "audio", "default_compatibility_rules", "default_font", "lzma", "mp3", "nellymoser"] }
ruffle_frontend_utils = { git = "https://github.com/toommyliu/ruffle", rev = "b22a3560baeddbfb92001f54b47561997563a032", default-features = false, features = ["cpal", "fs"] }
ruffle_render = { git = "https://github.com/toommyliu/ruffle", rev = "b22a3560baeddbfb92001f54b47561997563a032" }
ruffle_render_wgpu = { git = "https://github.com/toommyliu/ruffle", rev = "b22a3560baeddbfb92001f54b47561997563a032" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[patch.crates-io]
naga = { git = "https://github.com/toommyliu/ruffle", rev = "b22a3560baeddbfb92001f54b47561997563a032" }
wgpu-core = { git = "https://github.com/toommyliu/ruffle", rev = "b22a3560baeddbfb92001f54b47561997563a032" }
wgpu-hal = { git = "https://github.com/toommyliu/ruffle", rev = "b22a3560baeddbfb92001f54b47561997563a032" }
wgpu-types = { git = "https://github.com/toommyliu/ruffle", rev = "b22a3560baeddbfb92001f54b47561997563a032" }


[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
